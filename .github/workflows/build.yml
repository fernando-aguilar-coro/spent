name: Build & Release Spent Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # # 1. Build Debug APK
    # - name: Build Android Debug APK
    #   run: ./gradlew :app:assembleDebug

    # - name: Upload Android Debug APK
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: spent-android-debug-apk
    #     path: app/build/outputs/apk/debug/*.apk
    #     if-no-files-found: error

    # 2. Build Signed Release App Bundle (.aab) - Gradle decodes KEYSTORE_BASE64 automatically
    - name: Build Release App Bundle (.aab)
      run: ./gradlew :app:bundleRelease --stacktrace

    # 3. Upload Release App Bundle (.aab)
    - name: Upload Release App Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: spent-release-bundle
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: error